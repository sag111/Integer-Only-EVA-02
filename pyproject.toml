[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "int-pytorch"
version = "0.1.0"
description = "Pure PyTorch Integer Inference for EVA-02 Transformers"
readme = "README.md"
requires-python = ">=3.10"

keywords = [
    "quantization",
    "eva02",
    "vision-transformer",
    "pytorch",
    "integer-inference",
    "int8"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "torch>=2.0.0",
    "numpy",
    "timm>=0.9.0",
    "datasets",
    "tqdm",
    "Pillow"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["int_pytorch*"]
